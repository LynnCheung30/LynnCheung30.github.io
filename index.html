<h1>hongguo rclone</h1>
<p>A personal, single-user tool. It uses <a href="https://rclone.org">rclone</a> to copy research data files
from the owner's own university computing account to the owner's own Google Drive, so the owner can
open the latest data on their own computer.</p>
<p>It is not offered to other users. See the <a href="privacy.html">privacy policy</a>.</p>
